# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.6"
metadata:
  name: smm.hcmapp.dis.eecard3
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://sapwdp.sinarmasmining.com:8002/
          client: "100"
          auth: basic
        credentials:
          username: env:FED_100_USERNAME
          password: env:FED_100_PASSWORD
        app:
          name: ZHCM_EECAR3_DIS
          description: My Employee Card 3.0
          package: ZABAP
          transport: FEDK901257
