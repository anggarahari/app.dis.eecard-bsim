# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "2.6"
metadata:
  name: bsim.hcmapp.dis.eecard3
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        verbose: true
        target:
          url: http://sap-app-dv.cd.banksinarmas.com:8011
          client: "100"
          auth: basic
        credentials:
          username: env:S4D_USERNAME
          password: env:S4D_PASSWORD
        app:
          name: ZHR_EECAR3_DIS
          description: My Employee Card
          package: ZHR01
          transport: S4DK900933
