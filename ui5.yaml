specVersion: "2.6"
metadata:
  name: smm.hcmapp.dis.eecard3
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: https://sapwdp.sinarmasmining.com:8002/
            client: "100"
            destination: FED
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.71.49
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: smm.hcmapp.dis.eecard3
        ui5Theme: sap_fiori_3
