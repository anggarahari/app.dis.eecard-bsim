specVersion: "2.6"
metadata:
  name: bsim.hcmapp.dis.eecard3
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap/opu/odata/sap/ZHR_TLPROF_MAN_SRV
            url: http://sap-app-dv.cd.banksinarmas.com:8011
            client: "110"
            destination: S4D
          - path: /sap
            url: http://sap-app-dv.cd.banksinarmas.com:8011
            client: '110'
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.71.49
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: bsim.hcmapp.dis.eecard3
        ui5Theme: sap_fiori_3
