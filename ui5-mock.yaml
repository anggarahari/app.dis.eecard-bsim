specVersion: "2.5"
metadata:
  name: bsim.hcmapp.man.dis.eecard3
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap/opu/odata/sap/ZHR_TLPROF_MAN_SRV
            url: http://sap-app-dv.cd.banksinarmas.com:8011
            client: "110"
          - path: /sap
            url: http://sap-app-dv.cd.banksinarmas.com:8011
            client: "110"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        service:
          - urlPath: /sap/opu/odata/sap/ZHCM_TLPROF_MAN_SRV
            metadataXmlPath: ./webapp/localService/ZHCM_TLPROF_MAN_SRV/metadata.xml
            mockdataRootPath: ./webapp/localService/ZHCM_TLPROF_MAN_SRV/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZHR_TLPROF_MAN_SRV
            metadataXmlPath: ./webapp/localService/ZHR_TLPROF_MAN_SRV/metadata.xml
            mockdataRootPath: ./webapp/localService/ZHR_TLPROF_MAN_SRV/mockdata
            generateMockData: true
        annotations: []
